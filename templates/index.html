<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAGLE VISION | Social Distancing Protocol</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=6.0">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body class="assassins-theme">
    <div class="smoky-bg"></div>
    <header>
        <div class="header-left">
            <div class="ac-header-logo"></div>
            <div class="logo-text">
                <span class="vision-title">Eagle_vision_social_Distancing</span>
                <span class="sub-logo">Brotherhood Protocol v6.0</span>
            </div>
        </div>
        <div class="system-status">
            <div class="status-item">
                <span class="label">SYNC STATUS:</span>
                <span class="value" id="status-text">SYNCHRONIZED</span>
            </div>
            <div class="status-item">
                <span class="label">HARDWARE TYPE:</span>
                <span class="value" id="device-info">DETECTING...</span>
            </div>
        </div>
    </header>

    <main>
        <div class="video-container">
            <div class="overlay-elements">
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>
            </div>
            <img src="{{ url_for('video_feed') }}" id="video-feed" alt="Eagle Vision Feed">
            <!-- Eagle Eye Shutter -->
            <div class="eagle-shutter" id="eagle-shutter">
                <div class="shutter-top"></div>
                <div class="shutter-bottom"></div>
            </div>
            
            <div class="desync-overlay" id="desync-overlay"></div>
            <canvas id="overlay-canvas"></canvas>
        </div>

        <aside class="dashboard">
            <div class="stat-card glass-panel">
                <h3>TARGET POPULATION</h3>
                <div class="stat-value" id="people-count">0</div>
                <div class="accent-bar gold-bar"></div>
            </div>
            <div class="stat-card glass-panel violation-card">
                <h3>SYNCHRONIZATION ERRORS</h3>
                <div class="stat-value" id="violation-count">0</div>
                <div class="accent-bar red-bar"></div>
            </div>
            <div class="prediction-box glass-panel">
                <h3>TACTICAL PREDICTIONS</h3>
                <ul class="prediction-list" id="prediction-list">
                    <!-- Dynamic predictions -->
                </ul>
            </div>
            <div class="controls glass-panel">
                <div class="protocol-info">
                    <h4>BROTHERHOOD PROTOCOL</h4>
                    <p>Toggle Eagle Vision synchronization. When suspended, detection and tracking cease.</p>
                </div>
                <button class="ac-btn" id="toggle-detection">PROTOCOL: ACTIVE</button>
            </div>
        </aside>
    </main>

    <footer class="terminal glass-panel">
        <div class="log-stream" id="log-stream">
            <!-- Dynamic Logs Injected by main.js -->
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}?v=6.0"></script>
</body>
</html>
